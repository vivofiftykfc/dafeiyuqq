<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会话行为与角色 · QQ Bridge</title>
<style>body{font:15px/1.7 system-ui;background:#f4f7fa;color:#233348;max-width:1100px;margin:32px auto;padding:0 20px}section{background:white;border:1px solid #dde5ed;border-radius:16px;padding:24px;margin:20px 0}button,select,input{font:inherit;padding:8px;border:1px solid #c7d5e2;border-radius:6px;background:white}button{cursor:pointer;color:#17568a}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #eee}pre{white-space:pre-wrap;max-height:420px;overflow:auto}label{display:inline-block;margin:8px}#error{color:#a32626}.muted{color:#607080}</style>
<a href="/">← QQ Bridge</a><h1>会话行为与角色</h1><p>按会话选择模式；人格与记忆原文件保留。群聊仍受白名单约束，保存不会添加白名单或主动发消息。</p>
<section><label>控制台令牌 <input id="token" type="password" autocomplete="off"></label><button id="refresh">连接／刷新</button><p id="error" role="alert"></p><div style="overflow:auto"><table><thead><tr><th>会话</th><th>模式</th><th>角色来源</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<section><h2>指定会话</h2><label>会话 ID <input id="key" placeholder="group:群号 或 private:QQ号"></label><label>行为 <select id="mode"><option value="inherit">继承全局模式</option><option value="off">关闭</option><option value="chat">被动聊天（现有 chat）</option><option value="reserved2">二代仿真</option><option value="closed-agent">主人工具模式</option></select></label><label>角色 <select id="role"><option value="inherit">继承当前角色</option></select></label><label>主动程度 <select id="proactive"><option value="inherit">继承现有设置</option><option value="off">不做回复检查或主动分享</option><option value="reply">仅回复检查</option><option value="share">允许主动分享（仍受全局开关约束）</option></select></label><p class="muted">主人工具模式和主人二代仿真使用 identity.md 与主人工具，角色须选继承。其他会话使用受限工具与公开角色投影。角色不会授予权限。</p><button id="save">保存并应用到此会话</button> <button id="rollback">回滚此会话上一版</button> <button id="preview">查看当前最终人格与规则</button><p id="result" role="status"></p><pre id="previewText"></pre></section>
<script>
const $=id=>document.getElementById(id);let entries=[];
try{$('token').value=new URL(location.href).searchParams.get('token')||localStorage.getItem('consoleToken')||'';history.replaceState(null,'','/session-policies');}catch{}
async function api(url,body){const r=await fetch(url,{method:body?'POST':'GET',headers:{'x-console-token':$('token').value,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const v=await r.json();if(!r.ok||v.ok===false)throw Error(v.error||'接口不可用，请检查新版 Bridge 是否加载');return v;}
async function refresh(){const r=await api('/api/session-policies');entries=r.entries;$('rows').replaceChildren();$('role').replaceChildren(new Option('继承当前角色','inherit'),new Option('不使用普通角色卡','none'),...r.roles.map(x=>new Option(x,x)));for(const row of entries){const tr=document.createElement('tr');for(const v of [row.key,row.mode,row.personaSource,row.allowed?(row.applied?'模型会话已加载':'已配置，待新消息加载'):'关闭或不在白名单']){const td=document.createElement('td');td.textContent=v;tr.append(td);}const td=document.createElement('td'),b=document.createElement('button');b.textContent='编辑';b.onclick=()=>{$('key').value=row.key;$('mode').value=row.configuredMode||'inherit';$('role').value=row.configuredRole===undefined?'inherit':row.configuredRole===null?'none':row.configuredRole;$('proactive').value=row.proactive;$('result').textContent='版本 '+row.revision+' · 权限 '+row.permissions+' · 记忆按当前会话隔离';};td.append(b);tr.append(td);$('rows').append(tr);}const active=entries.find(x=>x.key===$('key').value.trim());if(active){$('mode').value=active.configuredMode||'inherit';$('role').value=active.configuredRole===undefined?'inherit':active.configuredRole===null?'none':active.configuredRole;$('proactive').value=active.proactive;}}
function run(fn){return async()=>{try{$('error').textContent='';await fn();}catch(e){$('error').textContent=e.message;}};}
$('refresh').onclick=run(refresh);$('save').onclick=run(async()=>{const role=$('role').value;const r=await api('/api/session-policies',{key:$('key').value.trim(),mode:$('mode').value,proactive:$('proactive').value,...(role==='inherit'?{}:{role:role==='none'?null:role})});$('result').textContent=r.note;await refresh();});$('rollback').onclick=run(async()=>{const r=await api('/api/session-policies',{key:$('key').value.trim(),rollback:true});$('result').textContent=r.note;await refresh();});$('preview').onclick=run(async()=>{$('previewText').textContent=(await api('/api/session-policies/preview?key='+encodeURIComponent($('key').value.trim()))).text;});if($('token').value)run(refresh)();
</script></html>
