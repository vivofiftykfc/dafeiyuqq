<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>大肥鱼 · 本地聊天</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f9;color:#263642;font:16px/1.7 system-ui,"Microsoft Yahei",sans-serif}main{max-width:850px;height:100dvh;margin:auto;display:flex;flex-direction:column}header{padding:24px 25px 12px;border-bottom:1px solid #e1e7eb}h1{margin:0;font-size:24px}small{color:#697e8b}#messages{flex:1;overflow:auto;padding:24px}article{margin:0 0 18px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere;padding:12px 18px;border-radius:16px;background:white;border:1px solid #e6ecef}.user{margin-left:auto;background:#e4f1f0}.bot{margin-right:auto}form{display:flex;gap:12px;padding:15px 24px 24px}textarea{resize:none;flex:1;border:1px solid #cedbdc;border-radius:12px;padding:12px;font:inherit;min-height:72px}button{border:0;border-radius:12px;background:#266b70;color:white;padding:0 23px;font:inherit;cursor:pointer}button:disabled{opacity:.5}#status{padding:0 25px;font-size:13px;color:#697e8b}
</style><main><header><h1>大肥鱼</h1><small>本地记忆 · 连续聊天 · DeepSeek</small></header><section id="messages" aria-live="polite"></section><div id="status">连接中…</div><form id="form"><textarea id="input" placeholder="说点什么吧，Enter 发送，Shift+Enter 换行" aria-label="消息"></textarea><button id="send" disabled>发送</button></form></main>
<script>
const box=document.querySelector('#messages'),status=document.querySelector('#status'),input=document.querySelector('#input'),button=document.querySelector('#send');let ws;
function bubble(text,role){if(!text)return;let a=document.createElement('article');a.className=role;a.textContent=text;box.append(a);box.scrollTop=box.scrollHeight}
function connect(){ws=new WebSocket('ws://'+location.host+'/ws');ws.onopen=()=>{status.textContent='已连接';button.disabled=false};ws.onclose=()=>{status.textContent='连接已断开，正在重连…';button.disabled=true;setTimeout(connect,3000)};ws.onmessage=e=>{const m=JSON.parse(e.data),d=m.data||{};if(m.event==='history'){box.textContent='';for(const x of d.messages||[])bubble(x.content,x.is_bot?'bot':'user')}if(m.event==='bot_message')bubble(d.content,'bot');if(m.event==='user_message')bubble(d.content,'user');if(m.event==='typing')status.textContent=d.is_typing?'大肥鱼正在想…':'已连接';if(m.event==='error')status.textContent=d.content||d.message||'服务异常'}}
document.querySelector('#form').onsubmit=e=>{e.preventDefault();if(ws.readyState!==1||!input.value.trim())return;ws.send(JSON.stringify({id:crypto.randomUUID(),content:input.value}));input.value='';input.focus()};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();document.querySelector('#form').requestSubmit()}};connect();
</script></html>
